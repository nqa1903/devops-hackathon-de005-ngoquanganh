server {
    listen 8086;
    listen [::]:8086;

    server_name 180.93.125.129;

    root /var/www/devops-hackathon-de006-ngoquanganh/src;
    index index.html;

    access_log /var/log/nginx/ngoquanganh-cntt3.access.log;
    error_log /var/log/nginx/ngoquanganh-cntt3.error.log;

    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
}
